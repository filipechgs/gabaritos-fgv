<html lang="pt-BR">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabarito Dinâmico — Provas FGV · Dataprev 2026</title>
<style>

    --bg: #0f1419;
    --surface: #1a2332;
    --surface2: #243044;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --ok: #22c55e;
    --ok-bg: #14532d33;
    --err: #ef4444;
    --err-bg: #7f1d1d33;
    --warn: #f59e0b;
    --anul: #a855f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { margin: 0 0 .25rem; font-size: 1.25rem; }
  header p { margin: 0; color: var(--muted); font-size: .875rem; }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    padding: .75rem 1.5rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 72px;
    z-index: 99;
  }
  .tab {
    padding: .45rem .85rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: .8rem;
    transition: .15s;
  }
  .tab:hover { border-color: var(--accent); color: var(--text); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 720px; margin: 0 auto; padding: 1rem 1.5rem 6rem; }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: .75rem;
    align-items: center;
    margin-bottom: 1.25rem;
    padding: 1rem;
    background: var(--surface);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .toolbar button {
    padding: .55rem 1.1rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: .875rem;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: transparent; color: var(--err); border: 1px solid var(--err); }
  .stats { font-size: .875rem; color: var(--muted); flex: 1; min-width: 200px; }
  .stats strong { color: var(--text); }
  .filter-bar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .filter-bar input {
    flex: 1; min-width: 180px;
    padding: .5rem .75rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
  }
  .q-card {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: .6rem 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .45rem .75rem;
    margin-bottom: .45rem;
    transition: border-color .2s, background .2s;
  }
  .q-card.checked-ok { border-color: var(--ok); background: var(--ok-bg); }
  .q-card.checked-err { border-color: var(--err); background: var(--err-bg); }
  .q-card.checked-anul { border-color: var(--anul); }
  .q-card.checked-blank { border-color: var(--warn); }
  .q-num {
    font-weight: 700;
    color: var(--accent);
    min-width: 2.5rem;
    font-size: .95rem;
    font-variant-numeric: tabular-nums;
  }
  .q-meta {
    display: flex;
    align-items: center;
    gap: .5rem;
    flex: 1;
    min-width: 120px;
  }
  .options { display: flex; flex-direction: row; gap: .35rem; flex-wrap: wrap; margin-left: auto; }
  .opt {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.25rem;
    height: 2.25rem;
    padding: 0 .5rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    font-size: .875rem;
    font-weight: 600;
    transition: background .1s, border-color .1s;
    user-select: none;
  }
  .opt:hover { border-color: var(--accent); }
  .opt input { position: absolute; opacity: 0; width: 0; height: 0; }
  .opt:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt.correct { background: var(--ok); border-color: var(--ok); color: #fff; }
  .opt.wrong-pick { background: var(--err); border-color: var(--err); color: #fff; }
  .opt.correct-hint { box-shadow: 0 0 0 2px var(--ok); }
  .result-badge {
    font-size: .75rem;
    font-weight: 600;
    padding: .2rem .55rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge-ok { background: var(--ok); color: #fff; }
  .badge-err { background: var(--err); color: #fff; }
  .badge-anul { background: var(--anul); color: #fff; }
  .badge-blank { background: var(--warn); color: #000; }
  .feedback {
    width: 100%;
    font-size: .78rem;
    color: var(--muted);
    padding-top: .15rem;
  }
  .summary-panel {
    display: none;
    margin-bottom: 1.25rem;
    padding: 1rem 1.25rem;
    border-radius: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
  }
  .summary-panel.visible { display: block; }
  .summary-panel h3 { margin: 0 0 .5rem; font-size: 1rem; }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: .75rem;
  }
  .summary-item { text-align: center; }
  .summary-item .val { font-size: 1.5rem; font-weight: 700; }
  .summary-item .lbl { font-size: .75rem; color: var(--muted); }
  .hidden { display: none !important; }
  @media print {
    header, .tabs, .toolbar, .filter-bar { position: static; }
    .q-card { break-inside: avoid; }
  }
</style>
</head>

      <div class="summary-item"><div class="val" style="color:var(--err)">${erros}</div><div class="lbl">Erros</div></div>
      <div class="summary-item"><div class="val" style="color:var(--warn)">${brancos}</div><div class="lbl">Não marcadas</div></div>
      <div class="summary-item"><div class="val" style="color:var(--anul)">${anuladas}</div><div class="lbl">Anuladas</div></div>
      <div class="summary-item"><div class="val">${exam.questions.length ? Math.round(acertos/exam.questions.filter(q=>q.answer).length*100) : 0}%</div><div class="lbl">Aproveitamento*</div></div>
    </div>
    <p style="font-size:.75rem;color:var(--muted);margin:.75rem 0 0">* Desconsidera questões anuladas no cálculo.</p>
  `;
}

function renderQuestions(exam, answers) {
  const container = document.getElementById('questions');
  if (!container) return;
  container.innerHTML = exam.questions.map(q => {
    const pick = answers[q.n];
    let cardClass = '';
    let badge = '';
    let feedbackHtml = '';

    if (checked) {
      if (q.answer === null) {
        cardClass = 'checked-anul';
        badge = '<span class="result-badge badge-anul">ANULADA</span>';
        feedbackHtml = 'Questão anulada no gabarito oficial.';
      } else if (!pick) {
        cardClass = 'checked-blank';
        badge = '<span class="result-badge badge-blank">EM BRANCO</span>';
        feedbackHtml = `Correta: <strong>${q.answer}</strong>`;
      } else if (pick === q.answer) {
        cardClass = 'checked-ok';
        badge = '<span class="result-badge badge-ok">OK</span>';
      } else {
        cardClass = 'checked-err';
        badge = '<span class="result-badge badge-err">ERRO</span>';
        feedbackHtml = `Você: <strong>${pick}</strong> · Correta: <strong>${q.answer}</strong>`;
      }
    }

    const opts = ['A','B','C','D','E'].map(letter => {
      let cls = 'opt';
      if (checked && q.answer && letter === q.answer) cls += ' correct';
      if (checked && pick && pick !== q.answer && letter === q.answer) cls += ' correct-hint';
      if (checked && pick === letter && letter !== q.answer) cls += ' wrong-pick';
      return `<label class="${cls}">
        <input type="radio" name="q${q.n}" value="${letter}" ${pick===letter?'checked':''} ${checked?'disabled':''}>
        <span>${letter}</span>
      </label>`;
    }).join('');

    return `<article class="q-card ${cardClass}" data-n="${q.n}">
      <span class="q-num">${q.n}</span>
      <div class="q-meta">${badge}${feedbackHtml ? `<span class="feedback">${feedbackHtml}</span>` : ''}</div>
      <div class="options">${opts}</div>
    </article>`;
  }).join('');

  container.querySelectorAll('input[type=radio]').forEach(inp => {
    inp.addEventListener('change', e => {
      if (checked) return;
      saveAnswer(currentExam, parseInt(inp.name.slice(1)), e.target.value);
      const exam = examById(currentExam);
      const answered = exam.questions.filter(q => loadAnswers(currentExam)[q.n]).length;
      document.querySelector('.stats').innerHTML = `
        <strong>${exam.title}</strong> · Tipo ${exam.tipo} ·
        ${answered}/${exam.total} marcadas`;
    });
  });
  filterQuestions();
}

function filterQuestions() {
  const q = (document.getElementById('searchQ')?.value || '').trim();
  const only = document.getElementById('onlyMarked')?.checked;
  const answers = loadAnswers(currentExam);
  document.querySelectorAll('.q-card').forEach(card => {
    const n = card.dataset.n;
    const matchSearch = !q || n.includes(q);
    const matchMarked = !only || !!answers[n];
    card.classList.toggle('hidden', !(matchSearch && matchMarked));
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
}

renderTabs();
renderExam();
</script>
</body>
</html>
