<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a2332">
<meta name="description" content="Questões-guia FGV do edital Dataprev — responda, confira e veja resultados por assunto.">
<meta name="application-name" content="Prova FGV">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prova FGV">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
<title>Prova FGV — Guia</title>
<style>
  :root {
    --bg: #0f1419;
    --surface: #1a2332;
    --surface2: #243044;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --ok: #22c55e;
    --ok-bg: #14532d44;
    --err: #ef4444;
    --err-bg: #7f1d1d44;
    --warn: #f59e0b;
    --img: #f472b6;
    --nav-h: 3.4rem;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding-top: calc(var(--nav-h) + var(--safe-top));
    padding-bottom: calc(3.5rem + var(--safe-bot));
  }
  .navbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    display: flex; align-items: center; gap: .6rem;
    min-height: calc(var(--nav-h) + var(--safe-top));
    padding: var(--safe-top) .75rem 0 .85rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .nav-brand { display: flex; align-items: center; gap: .4rem; flex-shrink: 0; }
  .nav-brand-icon {
    width: 1.55rem;
    height: 1.55rem;
    border-radius: 6px;
    display: block;
  }
  .nav-brand-text { font-size: .8rem; font-weight: 700; }
  .nav-status {
    flex: 1; min-width: 0; font-size: .75rem; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-align: right;
  }
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 200;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: .25rem; padding: .35rem .5rem calc(.4rem + var(--safe-bot));
    background: var(--surface); border-top: 1px solid var(--border);
  }
  .bottom-nav button {
    border: none; background: transparent; color: var(--muted);
    padding: .45rem .25rem; border-radius: 8px; cursor: pointer;
    font-size: .72rem; font-weight: 600;
  }
  .bottom-nav button.active { color: var(--accent); background: #3b82f622; }
  .bottom-nav .ico { display: block; font-size: 1.1rem; line-height: 1.2; }
  main { max-width: 760px; margin: 0 auto; padding: .9rem 1rem 1.5rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .35rem; }
  .lead { color: var(--muted); font-size: .88rem; margin: 0 0 1.1rem; }
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 1rem; margin-bottom: 1rem;
  }
  .panel h2 { margin: 0 0 .75rem; font-size: .95rem; }
  label.field { display: block; font-size: .75rem; color: var(--muted); margin: 0 0 .35rem; }
  select, input[type="search"] {
    width: 100%; padding: .65rem .75rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface2); color: var(--text);
    font-size: .9rem; margin-bottom: .85rem;
  }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
  .btn {
    border: none; border-radius: 8px; padding: .6rem 1rem;
    font-weight: 600; font-size: .875rem; cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost { background: transparent; color: var(--accent); border: 1px solid transparent; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .meta-chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0 0; }
  .chip {
    font-size: .72rem; padding: .2rem .55rem; border-radius: 999px;
    background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
  }
  .chip.accent { color: var(--accent); border-color: #3b82f688; }
  .chip.warn { color: var(--warn); border-color: #f59e0b88; }
  .chip.img { color: var(--img); border-color: #f472b688; }
  .q-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 1rem; margin-bottom: .9rem;
  }
  .q-card.ok { border-color: var(--ok); background: linear-gradient(180deg, var(--ok-bg), var(--surface)); }
  .q-card.err { border-color: var(--err); background: linear-gradient(180deg, var(--err-bg), var(--surface)); }
  .q-head { display: flex; flex-wrap: wrap; gap: .4rem .65rem; align-items: center; margin-bottom: .65rem; }
  .q-num { font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .q-exam { font-size: .72rem; color: var(--muted); }
  .stem {
    font-size: .92rem; margin: 0 0 .85rem;
    word-break: break-word;
  }
  .stem p {
    margin: 0 0 .7em;
    line-height: 1.45;
  }
  .stem p:last-child { margin-bottom: 0; }
  .opts { display: flex; flex-direction: column; gap: .45rem; }
  .opt {
    display: flex; gap: .65rem; align-items: flex-start;
    padding: .65rem .7rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface2);
    cursor: pointer; text-align: left; color: inherit; width: 100%;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .opt.correct { border-color: var(--ok); background: var(--ok-bg); }
  .opt.wrong { border-color: var(--err); background: var(--err-bg); }
  .opt-letter {
    flex-shrink: 0; width: 1.6rem; height: 1.6rem; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: .8rem; background: var(--border); color: var(--text);
  }
  .opt.selected .opt-letter { background: var(--accent); color: #fff; }
  .opt.correct .opt-letter { background: var(--ok); color: #fff; }
  .opt.wrong .opt-letter { background: var(--err); color: #fff; }
  .opt-text { flex: 1; font-size: .86rem; white-space: pre-wrap; word-break: break-word; }
  .q-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .85rem; align-items: center; }
  .feedback { font-size: .85rem; font-weight: 600; }
  .feedback.ok { color: var(--ok); }
  .feedback.err { color: var(--err); }
  .toolbar-sticky {
    position: sticky; top: calc(var(--nav-h) + var(--safe-top)); z-index: 50;
    background: #0f1419ee; backdrop-filter: blur(6px);
    padding: .55rem 0; margin-bottom: .75rem;
    border-bottom: 1px solid var(--border);
  }
  .stat-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: .65rem; margin-bottom: 1rem;
  }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: .75rem; text-align: center;
  }
  .stat .val { font-size: 1.4rem; font-weight: 800; }
  .stat .lbl { font-size: .72rem; color: var(--muted); }
  .theme-block { margin-bottom: 1.1rem; }
  .theme-block h3 {
    margin: 0 0 .55rem; font-size: .92rem;
    padding: .4rem .55rem; border-left: 3px solid var(--accent);
    background: linear-gradient(90deg, #243044aa, transparent);
  }
  .mini-q {
    display: flex; flex-wrap: wrap; gap: .35rem .6rem; align-items: center;
    padding: .45rem .55rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); margin-bottom: .35rem; font-size: .8rem;
  }
  .mini-q.ok { border-color: #22c55e66; }
  .mini-q.err { border-color: #ef444466; }
  .empty { color: var(--muted); font-size: .9rem; padding: 1.5rem .5rem; text-align: center; }
  .hidden { display: none !important; }
  .img-banner {
    display: flex; gap: .5rem; align-items: flex-start;
    padding: .55rem .7rem; margin: 0 0 .75rem;
    border-radius: 8px; border: 1px solid #f472b666;
    background: #83184333; color: #fbcfe8; font-size: .8rem;
  }
</style>
</head>
<body>
<nav class="navbar" aria-label="Principal">
  <div class="nav-brand">
    <img class="nav-brand-icon" src="./icon-192.png" width="28" height="28" alt="">
    <span class="nav-brand-text">Prova FGV</span>
  </div>
  <div class="nav-status" id="navStatus">Carregando…</div>
</nav>

<main id="main"></main>

<nav class="bottom-nav" aria-label="Navegação">
  <button type="button" data-view="home" id="tabHome"><span class="ico">🏠</span>Início</button>
  <button type="button" data-view="quiz" id="tabQuiz"><span class="ico">📋</span>Questões</button>
  <button type="button" data-view="results" id="tabResults"><span class="ico">📊</span>Resultados</button>
</nav>

<script src="./data.js"></script>
<script src="./app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
