<style>

    --bg: #0f1419;
    --surface: #1a2332;
    --surface2: #243044;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --ok: #22c55e;
    --ok-bg: #14532d33;
    --err: #ef4444;
    --err-bg: #7f1d1d33;
    --warn: #f59e0b;
    --anul: #a855f7;
    --geral: #22d3ee;
    --geral-bg: #08334466;
    --nav-h: 3.5rem;
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding-top: calc(var(--nav-h) + var(--safe-top));
  }
  .navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    gap: .65rem;
    min-height: calc(var(--nav-h) + var(--safe-top));
    padding: var(--safe-top) .75rem 0 .9rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: .5rem;
    flex-shrink: 0;
  }
  .nav-brand-emoji {
    font-size: 1.35rem;
    line-height: 1;
  }
  .nav-brand-text {
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .01em;
    color: var(--text);
    line-height: 1.15;
    white-space: nowrap;
  }
  .nav-exam {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: .1rem;
    padding: .35rem .55rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: inherit;
    cursor: pointer;
    text-align: left;
  }
  .nav-exam:hover, .nav-exam:focus-visible {
    border-color: var(--accent);
    outline: none;
  }
  .nav-exam-label {
    font-size: .65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .nav-exam-title {
    font-size: .82rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-exam-meta {
    font-size: .7rem;
    color: var(--muted);
  }
  .nav-chevron {
    flex-shrink: 0;
    opacity: .7;
    font-size: .75rem;
  }
  .hint {
    max-width: 720px;
    margin: 0 auto;
    padding: .75rem 1.25rem 0;
    color: var(--muted);
    font-size: .8rem;
  }
  main { max-width: 720px; margin: 0 auto; padding: .75rem 1.25rem 6rem; }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: .75rem;
    align-items: center;
    margin-bottom: 1.25rem;
    padding: 1rem;
    background: var(--surface);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .toolbar button {
    padding: .55rem 1.1rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: .875rem;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .stats { font-size: .875rem; color: var(--muted); flex: 1; min-width: 160px; }
  .stats strong { color: var(--text); }
  .filter-bar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
  .filter-bar input {
    flex: 1; min-width: 160px;
    padding: .5rem .75rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
  }
  .section-block { margin-bottom: 1.35rem; }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: .75rem;
    flex-wrap: wrap;
    margin: 1.1rem 0 .55rem;
    padding: .45rem .65rem;
    border-left: 3px solid var(--accent);
    background: linear-gradient(90deg, #243044aa, transparent);
    border-radius: 0 8px 8px 0;
  }
  .section-head h3 {
    margin: 0;
    font-size: .92rem;
    font-weight: 700;
  }
  .section-head .sec-range {
    font-size: .72rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .guide-legend {
    display: flex;
    flex-wrap: wrap;
    gap: .55rem 1rem;
    align-items: center;
    margin-bottom: .85rem;
    padding: .65rem .85rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: .78rem;
    color: var(--muted);
  }
  .guide-swatch {
    display: inline-block;
    width: .85rem;
    height: .85rem;
    border-radius: 3px;
    vertical-align: -2px;
    margin-right: .25rem;
  }
  .guide-swatch.esp {
    background: #f59e0b33;
    border: 2px solid var(--warn);
  }
  .guide-swatch.geral {
    background: #22d3ee33;
    border: 2px solid var(--geral);
  }
  .guide-legend .lbl-esp { color: var(--warn); font-weight: 700; }
  .guide-legend .lbl-geral { color: var(--geral); font-weight: 700; }
  .q-card {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: .6rem 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .45rem .75rem;
    margin-bottom: .45rem;
    transition: border-color .2s, background .2s;
  }
  .q-card.guide-esp {
    border-color: #f59e0b99;
    background: linear-gradient(90deg, #f59e0b22, var(--surface) 42%);
    box-shadow: inset 3px 0 0 var(--warn);
  }
  .q-card.guide-esp .q-num { color: var(--warn); }
  .q-card.guide-geral {
    border-color: #22d3ee99;
    background: linear-gradient(90deg, #22d3ee22, var(--surface) 42%);
    box-shadow: inset 3px 0 0 var(--geral);
  }
  .q-card.guide-geral .q-num { color: var(--geral); }
  .badge-guide-esp { background: var(--warn); color: #111; }
  .badge-guide-geral { background: var(--geral); color: #083344; }
  .guide-topic {
    font-size: .72rem;
    color: var(--muted);
    width: 100%;
    order: 5;
  }
  .guide-topic em.esp { color: var(--warn); font-style: normal; font-weight: 700; }
  .guide-topic em.geral { color: var(--geral); font-style: normal; font-weight: 700; }
  .q-card.checked-ok { border-color: var(--ok); background: var(--ok-bg); }
  .q-card.checked-err { border-color: var(--err); background: var(--err-bg); }
  .q-card.checked-anul { border-color: var(--anul); }
  .q-card.checked-blank { border-color: var(--warn); }
  .q-card.guide-esp.checked-ok,
  .q-card.guide-esp.checked-err,
  .q-card.guide-esp.checked-blank,
  .q-card.guide-esp.checked-anul { box-shadow: inset 3px 0 0 var(--warn); }
  .q-card.guide-geral.checked-ok,
  .q-card.guide-geral.checked-err,
  .q-card.guide-geral.checked-blank,
  .q-card.guide-geral.checked-anul { box-shadow: inset 3px 0 0 var(--geral); }
  .q-num {
    font-weight: 700;
    color: var(--accent);
    min-width: 2.5rem;
    font-size: .95rem;
    font-variant-numeric: tabular-nums;
  }
  .q-meta {
    display: flex;
    align-items: center;
    gap: .5rem;
    flex: 1;
    min-width: 100px;
  }
  .options { display: flex; flex-direction: row; gap: .35rem; flex-wrap: wrap; margin-left: auto; }
  .opt {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.4rem;
    height: 2.4rem;
    padding: 0 .5rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    font-size: .875rem;
    font-weight: 600;
    transition: background .1s, border-color .1s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .opt:hover { border-color: var(--accent); }
  .opt input { position: absolute; opacity: 0; width: 0; height: 0; }
  .opt:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt.correct { background: var(--ok); border-color: var(--ok); color: #fff; }
  .opt.wrong-pick { background: var(--err); border-color: var(--err); color: #fff; }
  .opt.correct-hint { box-shadow: 0 0 0 2px var(--ok); }
  .result-badge {
    font-size: .75rem;
    font-weight: 600;
    padding: .2rem .55rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge-ok { background: var(--ok); color: #fff; }
  .badge-err { background: var(--err); color: #fff; }
  .badge-anul { background: var(--anul); color: #fff; }
  .badge-blank { background: var(--warn); color: #000; }
  .feedback {
    width: 100%;
    font-size: .78rem;
    color: var(--muted);
    padding-top: .15rem;
  }
  .summary-panel {
    display: none;
    margin-bottom: 1.25rem;
    padding: 1rem 1.25rem;
    border-radius: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
  }
  .summary-panel.visible { display: block; }
  .summary-panel h3 { margin: 0 0 .5rem; font-size: 1rem; }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: .75rem;
  }
  .summary-item { text-align: center; }
  .summary-item .val { font-size: 1.5rem; font-weight: 700; }
  .summary-item .lbl { font-size: .75rem; color: var(--muted); }
  .hidden { display: none !important; }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(0,0,0,.55);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .modal-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }
  @media (min-width: 640px) {
    .modal-backdrop { align-items: center; padding: 1.5rem; }
  }
  .modal {
    width: 100%;
    max-width: 440px;
    max-height: min(85vh, 640px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    display: flex;
    flex-direction: column;
    transform: translateY(20px);
    transition: transform .2s;
  }
  .modal-backdrop.open .modal { transform: translateY(0); }
  @media (min-width: 640px) {
    .modal { border-radius: 14px; }
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem 1.1rem;
    border-bottom: 1px solid var(--border);
  }
  .modal-header h2 { margin: 0; font-size: 1rem; }
  .modal-close {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
  }
  .modal-body {
    overflow: auto;
    padding: .75rem;
    -webkit-overflow-scrolling: touch;
  }
  .exam-option {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .2rem;
    text-align: left;
    padding: .85rem .9rem;
    margin-bottom: .45rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
  }
  .exam-option:hover { border-color: var(--accent); }
  .exam-option.active {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .exam-option-title { font-weight: 600; font-size: .9rem; }
  .exam-option-meta { font-size: .75rem; color: var(--muted); }
  .exam-option-check {
    font-size: .7rem;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  @media print {
    .navbar, .modal-backdrop, .toolbar, .filter-bar, .hint { display: none !important; }
    body { padding-top: 0; }
    .q-card { break-inside: avoid; }
  }
</style>

let currentExam = localStorage.getItem('gabarito_dataprev_current') || EXAMS[0]?.id || '';
if (!EXAMS.some(e => e.id === currentExam)) currentExam = EXAMS[0]?.id || '';
let checked = false;

function storageKey(examId) {
  return 'gabarito_dataprev_' + examId;
}

function loadAnswers(examId) {
  try { return JSON.parse(localStorage.getItem(storageKey(examId)) || '{}'); }
  catch { return {}; }
}

function saveAnswer(examId, qn, letter) {
  const data = loadAnswers(examId);
  data[qn] = letter;
  localStorage.setItem(storageKey(examId), JSON.stringify(data));
}

function clearExam(examId) {
  localStorage.removeItem(storageKey(examId));
}

function examById(id) { return EXAMS.find(e => e.id === id); }

function updateNavbar() {
  const exam = examById(currentExam);
  const titleEl = document.getElementById('navExamTitle');
  const metaEl = document.getElementById('navExamMeta');
  if (!exam) {
    titleEl.textContent = 'Nenhuma prova';
    metaEl.textContent = '';
    return;
  }
  titleEl.textContent = exam.title;
  metaEl.textContent = `Tipo ${exam.tipo} · ${exam.total} questões`;
}

function openExamModal() {
  const backdrop = document.getElementById('examModal');
  const list = document.getElementById('examModalList');
  list.innerHTML = EXAMS.map(e => `
    <button type="button" class="exam-option${e.id === currentExam ? ' active' : ''}" data-id="${e.id}">
      ${e.id === currentExam ? '<span class="exam-option-check">Selecionada</span>' : ''}
      <span class="exam-option-title">${esc(e.title)}</span>
      <span class="exam-option-meta">Tipo ${e.tipo} · ${e.total} questões</span>
    </button>
  `).join('');
  list.querySelectorAll('.exam-option').forEach(btn => {
    btn.addEventListener('click', () => selectExam(btn.dataset.id));
  });
  backdrop.hidden = false;
  requestAnimationFrame(() => backdrop.classList.add('open'));
  document.getElementById('btnCloseExamModal').focus();
}

function closeExamModal() {
  const backdrop = document.getElementById('examModal');
  backdrop.classList.remove('open');
  setTimeout(() => { backdrop.hidden = true; }, 200);
}

function selectExam(id) {
  if (id === currentExam) { closeExamModal(); return; }
  currentExam = id;
  localStorage.setItem('gabarito_dataprev_current', id);
  checked = false;
  updateNavbar();
  closeExamModal();
  renderExam();
}

function sectionForQuestion(exam, n) {
  return (exam.sections || []).find(s => n >= s.start && n <= s.end) || null;
}

function guideKindOf(q) {
  return q.guideKind || (q.guide ? 'esp' : null);
}

function guideAnsweredCount(exam, answers, kind) {
  return exam.questions.filter(q => {
    if (!q.guide || !answers[q.n]) return false;
    if (!kind) return true;
    return guideKindOf(q) === kind;
  }).length;
}

function renderExam() {
  const exam = examById(currentExam);
  if (!exam) return;
  updateNavbar();
  const answers = loadAnswers(currentExam);
  const answered = exam.questions.filter(q => answers[q.n]).length;
  const gEsp = guideAnsweredCount(exam, answers, 'esp');
  const gGer = guideAnsweredCount(exam, answers, 'geral');

  document.getElementById('main').innerHTML = `
    <div class="guide-legend">
      <span><span class="guide-swatch esp"></span><span class="lbl-esp">Específico</span> — Módulo II / checklist TI</span>
      <span><span class="guide-swatch geral"></span><span class="lbl-geral">Geral</span> — Módulo I (Port/Inglês/RLM/LEG)</span>
      <span>Esp: <strong id="guideEspStats" class="lbl-esp">${gEsp}/${exam.guideEspTotal || 0}</strong></span>
      <span>Geral: <strong id="guideGeralStats" class="lbl-geral">${gGer}/${exam.guideGeralTotal || 0}</strong></span>
    </div>
    <div class="toolbar">
      <button class="btn-primary" id="btnCheck">Verificar gabarito</button>
      <button class="btn-secondary" id="btnReset">Limpar respostas</button>
      <button class="btn-secondary" id="btnHide">Ocultar resultado</button>
      <div class="stats">${answered}/${exam.total} marcadas</div>
    </div>
    <div class="summary-panel" id="summary"></div>
    <div class="filter-bar">
      <input type="search" id="searchQ" placeholder="Filtrar por número da questão…">
      <label style="font-size:.8rem;color:var(--muted)">
        <input type="checkbox" id="onlyMarked"> Só marcadas
      </label>
      <label style="font-size:.8rem;color:var(--warn);font-weight:600">
        <input type="checkbox" id="onlyGuideEsp"> Só guia específico
      </label>
      <label style="font-size:.8rem;color:var(--geral);font-weight:600">
        <input type="checkbox" id="onlyGuideGeral"> Só guia geral
      </label>
    </div>
    <div id="questions"></div>
  `;

  renderQuestions(exam, answers);

  document.getElementById('btnCheck').onclick = () => { checked = true; renderQuestions(exam, loadAnswers(currentExam)); showSummary(exam); };
  document.getElementById('btnReset').onclick = () => {
    if (confirm('Limpar todas as respostas desta prova?')) {
      clearExam(currentExam); checked = false; renderExam();
    }
  };
  document.getElementById('btnHide').onclick = () => {
    checked = false;
    document.getElementById('summary').classList.remove('visible');
    renderQuestions(exam, loadAnswers(currentExam));
  };
  document.getElementById('searchQ').oninput = filterQuestions;
  document.getElementById('onlyMarked').onchange = filterQuestions;
  document.getElementById('onlyGuideEsp').onchange = filterQuestions;
  document.getElementById('onlyGuideGeral').onchange = filterQuestions;
}

function showSummary(exam) {
  const answers = loadAnswers(currentExam);
  let acertos = 0, erros = 0, brancos = 0, anuladas = 0;
  let gOk = 0, gErr = 0, gBlank = 0;
  exam.questions.forEach(q => {
    const pick = answers[q.n];
    if (q.answer === null) { anuladas++; return; }
    if (!pick) {
      brancos++;
      if (q.guide) gBlank++;
      return;
    }
    if (pick === q.answer) { acertos++; if (q.guide) gOk++; }
    else { erros++; if (q.guide) gErr++; }
  });
  const valid = exam.questions.filter(q => q.answer).length;
  const panel = document.getElementById('summary');
  panel.classList.add('visible');
  panel.innerHTML = `
    <h3>Resultado</h3>
    <div class="summary-grid">
      <div class="summary-item"><div class="val" style="color:var(--ok)">${acertos}</div><div class="lbl">Acertos</div></div>
      <div class="summary-item"><div class="val" style="color:var(--err)">${erros}</div><div class="lbl">Erros</div></div>
      <div class="summary-item"><div class="val" style="color:var(--warn)">${brancos}</div><div class="lbl">Não marcadas</div></div>
      <div class="summary-item"><div class="val" style="color:var(--anul)">${anuladas}</div><div class="lbl">Anuladas</div></div>
      <div class="summary-item"><div class="val">${valid ? Math.round(acertos/valid*100) : 0}%</div><div class="lbl">Aproveitamento*</div></div>
    </div>
    <p style="font-size:.8rem;color:var(--muted);margin:.85rem 0 0">
      Questões-guia: <span style="color:var(--ok)">${gOk} ok</span> ·
      <span style="color:var(--err)">${gErr} erro</span> ·
      <span style="color:var(--warn)">${gBlank} em branco</span>
      (de ${exam.guideTotal || 0})
    </p>
    <p style="font-size:.75rem;color:var(--muted);margin:.35rem 0 0">* Desconsidera questões anuladas no cálculo.</p>
  `;
}

function renderQuestions(exam, answers) {
  const container = document.getElementById('questions');
  if (!container) return;

  const bySection = new Map();

    ? exam.sections

  exam.questions.forEach(q => {

        cardClass += ' checked-anul';

        feedbackHtml = 'Questão anulada no gabarito oficial.';

        cardClass += ' checked-blank';
        badge += ' <span class="result-badge badge-blank">EM BRANCO</span>';
        feedbackHtml = `Correta: <strong>${q.answer}</strong>`;
      } else if (pick === q.answer) {
        cardClass += ' checked-ok';
        badge += ' <span class="result-badge badge-ok">OK</span>';
      } else {
        cardClass += ' checked-err';
        badge += ' <span class="result-badge badge-err">ERRO</span>';
        feedbackHtml = `Você: <strong>${pick}</strong> · Correta: <strong>${q.answer}</strong>`;

    return `<article class="q-card ${cardClass}" data-n="${q.n}" data-guide="${q.guide ? '1' : '0'}" data-guide-kind="${kind || ''}">
      <span class="q-num">${q.n}</span>
      <div class="q-meta">${badge}${feedbackHtml ? `<span class="feedback">${feedbackHtml}</span>` : ''}</div>
      <div class="options">${opts}</div>
      ${topic}
    </article>`;
  };

  container.innerHTML = blocks.map(({ section, qs }) => {
    if (!qs.length) return '';
    const guideEsp = qs.filter(q => guideKindOf(q) === 'esp').length;
    const guideGer = qs.filter(q => guideKindOf(q) === 'geral').length;
    const bits = [];
    if (guideEsp) bits.push(`${guideEsp} esp`);
    if (guideGer) bits.push(`${guideGer} geral`);
    return `<section class="section-block" data-section="${esc(section.title)}">
      <div class="section-head">
        <h3>${esc(section.title)}</h3>
        <span class="sec-range">Q${section.start}–${section.end}${bits.length ? ' · ' + bits.join(' · ') : ''}</span>
      </div>
      ${qs.map(renderCard).join('')}
    </section>`;
  }).join('');

  container.querySelectorAll('input[type=radio]').forEach(inp => {
    inp.addEventListener('change', e => {
      if (checked) return;
      saveAnswer(currentExam, parseInt(inp.name.slice(1)), e.target.value);
      const exam = examById(currentExam);
      const answers = loadAnswers(currentExam);
      const answered = exam.questions.filter(q => answers[q.n]).length;
      document.querySelector('.stats').textContent = `${answered}/${exam.total} marcadas`;
      const ge = document.getElementById('guideEspStats');
      const gg = document.getElementById('guideGeralStats');
      if (ge) ge.textContent = `${guideAnsweredCount(exam, answers, 'esp')}/${exam.guideEspTotal || 0}`;
      if (gg) gg.textContent = `${guideAnsweredCount(exam, answers, 'geral')}/${exam.guideGeralTotal || 0}`;
    });
  });
  filterQuestions();
}

function filterQuestions() {
  const q = (document.getElementById('searchQ')?.value || '').trim();
  const only = document.getElementById('onlyMarked')?.checked;
  const onlyEsp = document.getElementById('onlyGuideEsp')?.checked;
  const onlyGer = document.getElementById('onlyGuideGeral')?.checked;
  const answers = loadAnswers(currentExam);
  document.querySelectorAll('.q-card').forEach(card => {
    const n = card.dataset.n;
    const kind = card.dataset.guideKind;
    const matchSearch = !q || n.includes(q);
    const matchMarked = !only || !!answers[n];
    const matchEsp = !onlyEsp || kind === 'esp';
    const matchGer = !onlyGer || kind === 'geral';
    card.classList.toggle('hidden', !(matchSearch && matchMarked && matchEsp && matchGer));
  });
  document.querySelectorAll('.section-block').forEach(block => {
    const visible = [...block.querySelectorAll('.q-card')].some(c => !c.classList.contains('hidden'));
    block.classList.toggle('hidden', !visible);
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
}

document.getElementById('btnOpenExamModal').addEventListener('click', openExamModal);
document.getElementById('btnCloseExamModal').addEventListener('click', closeExamModal);
document.getElementById('examModal').addEventListener('click', (e) => {
  if (e.target.id === 'examModal') closeExamModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('examModal').classList.contains('open')) {
    closeExamModal();
  }
});

updateNavbar();
renderExam();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
